<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Login | STEM Forge</title>

    <!-- Prevent theme flash -->
    <script>
        (function() {
            const saved = localStorage.getItem('stemforge-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', theme === 'dark'? '#0f172a' : '#ffffff');
        })();
    </script>

    <!-- Fonts & Icons - SAME AS CASE STUDY -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">

    <!-- Tailwind CDN - SAME CONFIG AS CASE STUDY -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {

                        'on-secondary-fixed': '#131b2e',
                        'surface': '#fff8f4',
                        'tertiary-fixed-dim': '#7fd0ff',
                        'inverse-surface': '#382f25',
                        'tertiary-fixed': '#c5e7ff',
                        'primary-container': '#f59e0b',
                        'surface-container-high': '#f5e6d7',
                        'surface-dim': '#e7d7c9',

                        'surface-container': '#fbebdd',

                        'surface-gray': '#F8FAFC',

                        'surface-container-lowest': '#ffffff',
                        'surface-variant': '#f0e0d1',
                        'outline': '#867461',
                        'on-surface-variant': '#534434',
                        'on-secondary-container': '#5c647a',
                        'on-primary-container': '#613b00',
                        'on-background': '#221a12',
                        'primary-fixed-dim': '#ffb95f',

                        'border-subtle': '#E2E8F0'

    <!-- SAME CSS ORDER AS CASE STUDY -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/base/dark-background.css">
    <link rel="stylesheet" href="css/theme-toggle.css">
    <link rel="stylesheet" href="css/layout/container.css">
    <link rel="stylesheet" href="css/layout/nav.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/alerts.css">
    <link rel="stylesheet" href="css/pages/ai-generate.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/core/firebase-init.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
       .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body data-page="login" class="bg-surface-gray text-deep-navy font-body-md antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">

    <!-- Theme Toggle - ID PRESERVED -->
    <button class="theme-toggle fixed top-4 right-4 z-50 p-2 rounded-full bg-surface-container-lowest border border-border-subtle shadow-sm hover:bg-surface-container-highest transition-colors" id="theme-toggle" aria-label="Toggle theme">
        <svg class="icon-moon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
        <svg class="icon-sun w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
    </button>

    <!-- Login Container -->
    <main class="w-full max-w-md">
        <div class="bg-white rounded-xl border border-border-subtle shadow-sm p-card-padding md:p-6">

            <div class="flex justify-center mb-6">
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-surface-gray border border-border-subtle overflow-hidden">
                    <img src="Images/Logo/StemForge 1 (1).jfif" alt="STEM Forge Logo" class="w-16 h-16 object-contain">
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="font-headline-lg text-headline-lg text-deep-navy">Login to STEM Forge</h1>
                <p class="font-body-md text-body-md text-secondary mt-2">Sign in to access your dashboard and manage students</p>
            </div>

            <!-- ID: login-status PRESERVED -->
            <div id="login-status" class="hidden mb-6 p-4 rounded-xl text-center font-body-md text-body-md text-sm"></div>

            <!-- ID: login-form PRESERVED -->
            <form id="login-form" class="space-y-5">

                <div>
                    <label for="login-email" class="block font-label-md text-label-md text-secondary mb-2">Email</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">mail</span>
                        <input type="email" id="login-email" name="email" required placeholder="you@example.com" class="w-full pl-10 pr-4 py-3 bg-surface-gray border border-border-subtle rounded-lg focus:outline-none focus:border-forge-orange focus:ring-1 focus:ring-forge-orange font-body-md text-body-md">
                    </div>
                </div>

                <div>
                    <label for="login-password" class="block font-label-md text-label-md text-secondary mb-2">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">lock</span>
                        <input type="password" id="login-password" name="password" required placeholder="••••••••" autocomplete="current-password" class="w-full pl-10 pr-10 py-3 bg-surface-gray border border-border-subtle rounded-lg focus:outline-none focus:border-forge-orange focus:ring-1 focus:ring-forge-orange font-body-md text-body-md">
                        <!-- IDs PRESERVED: toggle-password-btn, password-toggle-icon -->
                        <button type="button" id="toggle-password-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-secondary hover:text-deep-navy" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined text-" id="password-toggle-icon">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center">
                    <!-- ID PRESERVED: remember-me -->
                    <input type="checkbox" id="remember-me" name="remember-me" class="h-4 w-4 text-forge-orange focus:ring-forge-orange border-border-subtle rounded bg-surface-gray cursor-pointer">
                    <label for="remember-me" class="ml-2 font-body-md text-body-md text-secondary text-sm cursor-pointer">Remember me on this device</label>
                </div>

                <!-- ID PRESERVED: login-btn -->
                <button type="submit" id="login-btn" class="w-full flex justify-center items-center py-3 px-4 rounded-xl shadow-sm font-label-md text-label-md text-white bg-forge-orange hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-forge-orange transition-all active:scale-[0.98]">
                    Sign In <span class="material-symbols-outlined ml-2">arrow_forward</span>
                </button>

                <div class="text-center">
                    <p class="font-body-md text-body-md text-secondary text-sm">Don't have an account? <a href="register-teacher.html" class="font-label-md text-forge-orange hover:underline">Create one →</a></p>
                </div>
            </form>

            <div class="mt-8 text-center border-t border-border-subtle pt-6">
                <p class="font-caption text-caption text-secondary flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-forge-orange text-sm">auto_awesome</span>
                    STEM Forge — multi-branch curriculum tools and admin portal
                </p>
            </div>

        </div>
    </main>

    <!-- JavaScript -->
    <script type="module" src="js/main.js"></script>

    <!-- Theme toggle sync -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtns = document.querySelectorAll('#theme-toggle, #theme-toggle-desktop');
            const html = document.documentElement;
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const currentTheme = html.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    html.setAttribute('data-theme', newTheme);
                    localStorage.setItem('stemforge-theme', newTheme);
                    const meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', newTheme === 'dark' ? '#0f172a' : '#ffffff');
                });
            });
        });
    </script>
</body>
</html>
