name: 📦 Build & Release Android APK

# Triggers ONLY when you push a version tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle / Android build tools) ─────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 3. Node (required to install Capacitor CLI) ────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Install Node dependencies ────────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 5. Sync Capacitor config into the Android project ──────────────────
      # In live-URL mode, cap sync just writes the server.url into the native
      # project config files — no web build step needed.
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 6. Stamp the version from the git tag ──────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "name=$TAG" >> $GITHUB_OUTPUT
          # Convert semver to integer versionCode: e.g. 1.2.3 → 10203
          CODE=$(echo "$TAG" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          echo "code=$CODE" >> $GITHUB_OUTPUT

      # ── 7. Patch versionName and versionCode in build.gradle ───────────────
      - name: Stamp Android version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.version.outputs.name }}"/' android/app/build.gradle
          echo "versionCode=$(grep versionCode android/app/build.gradle)"
          echo "versionName=$(grep versionName android/app/build.gradle)"

      # ── 8. Grant Gradle execute permission ────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 9. Build the debug APK ─────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 10. Find the APK and rename it ─────────────────────────────────────
      - name: Locate and rename APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          DEST="StemForge-v${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$DEST"
          echo "dest=$DEST" >> $GITHUB_OUTPUT

      # ── 11. Upload as workflow artifact ────────────────────────────────────
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StemForge-v${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.dest }}
          retention-days: 30

      # ── 12. Create GitHub Release and attach APK ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🚀 STEM Forge ${{ github.ref_name }}"
          body: |
            ## STEM Forge Android App — ${{ github.ref_name }}

            ### 📥 How to install
            1. Download `StemForge-v${{ steps.version.outputs.name }}.apk` below
            2. On your Android phone go to **Settings → Install unknown apps** and allow your browser/file manager
            3. Open the downloaded APK and tap **Install**
            4. Launch **STEM Forge** from your home screen

            ### ✨ Features
            - AI Lesson Plan & Notes generator
            - Student, Class & Attendance management
            - Scheme of Work planner
            - Teacher registration & login

            > This app requires an internet connection — it loads the live STEM Forge platform.
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.dest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
