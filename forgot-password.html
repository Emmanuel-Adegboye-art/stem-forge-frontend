<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
        <!-- Favicon -->
    <link rel="icon" type="image/jfif" href="Images/Logo/StemForge 1 (1).jfif">
    <link rel="shortcut icon" type="image/jfif" href="Images/Logo/StemForge 1 (1).jfif">
    <link rel="apple-touch-icon" href="Images/Logo/StemForge 1 (1).jfif">
    <title>Forgot Password | STEM Forge</title>
    <meta name="description" content="Reset your STEM Forge password and regain access to your account.">

    <!-- Prevent theme flash -->
    <script>
        (function() {
            const saved = localStorage.getItem('stemforge-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'forge-orange': '#F59E0B',
                        'deep-navy': '#0F172A',
                        'secondary': '#565e74',
                        'surface-gray': '#F8FAFC',
                        'border-subtle': '#e5e7eb',
                        'action-blue': '#2563EB'
                    },
                    fontFamily: { sans: ['Hanken Grotesk', 'sans-serif'] }
                }
            }
        };
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/core/firebase-init.js"></script>

    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .input-field {
            width: 100%; padding: 12px 44px 12px 44px;
            border: 1.5px solid #e5e7eb; border-radius: 10px;
            font-size: 15px; background: #F8FAFC;
            transition: border-color .2s, box-shadow .2s; outline: none;
        }
        .input-field:focus { border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245,158,11,.12); }
        .btn-primary {
            width: 100%; background: #F59E0B; color: #fff; font-weight: 700;
            padding: 14px; border-radius: 10px; border: none; cursor: pointer;
            font-size: 15px; font-family: 'Hanken Grotesk', sans-serif;
            transition: opacity .2s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover:not(:disabled) { opacity: .92; }
        .btn-primary:active:not(:disabled) { transform: scale(.98); }
        .btn-primary:disabled { opacity: .65; cursor: not-allowed; }

        /* Success state */
        #success-state { display: none; }
        #form-state.hidden { display: none; }
    </style>
</head>
<body class="bg-surface-gray min-h-screen flex items-center justify-center p-6 font-sans">

    <main class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white rounded-2xl border border-border-subtle shadow-sm overflow-hidden">

            <!-- Top bar -->
            <div class="bg-forge-orange px-8 py-6">
                <a href="index.html" class="flex items-center gap-2 mb-1 opacity-80 hover:opacity-100 transition-opacity">
                    <span class="material-symbols-outlined text-white text-sm">arrow_back</span>
                    <span class="text-white text-sm font-semibold">Back to STEM Forge</span>
                </a>
                <h1 class="text-white text-2xl font-bold mt-2">Forgot your password?</h1>
                <p class="text-white/80 text-sm mt-1">No worries — we'll send a reset link to your inbox.</p>
            </div>

            <div class="px-8 py-8">

                <!-- FORM STATE -->
                <div id="form-state">
                    <form id="forgot-form" class="space-y-5" novalidate>
                        <div>
                            <label for="forgot-email" class="block text-sm font-semibold text-deep-navy mb-1.5">Email address</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-xl">mail</span>
                                <input type="email" id="forgot-email" required
                                       placeholder="you@example.com"
                                       class="input-field">
                            </div>
                        </div>

                        <div id="forgot-error" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm"></div>

                        <button type="submit" id="forgot-btn" class="btn-primary">
                            <span class="material-symbols-outlined text-xl">send</span>
                            Send Reset Link
                        </button>
                    </form>

                    <p class="text-center text-sm text-secondary mt-5">
                        Remember your password?
                        <a href="login.html" class="text-forge-orange font-semibold hover:underline">Sign in →</a>
                    </p>
                </div>

                <!-- SUCCESS STATE (shown after submit) -->
                <div id="success-state" class="text-center py-4">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-symbols-outlined text-green-600 text-3xl">mark_email_read</span>
                    </div>
                    <h2 class="text-xl font-bold text-deep-navy mb-2">Check your inbox!</h2>
                    <p class="text-secondary text-sm mb-1">A password reset link has been sent to</p>
                    <p id="sent-email" class="font-semibold text-deep-navy text-sm mb-5"></p>
                    <p class="text-secondary text-xs">Didn't receive it? Check your spam folder or
                        <button id="resend-btn" class="text-forge-orange font-semibold hover:underline">try again</button>.
                    </p>
                </div>

            </div>
        </div>

    </main>

    <script type="module">
        import { CONFIG } from './js/core/config.js';

        document.getElementById('forgot-form').addEventListener('submit', async e => {
            e.preventDefault();
            const email   = document.getElementById('forgot-email').value.trim();
            const errBox  = document.getElementById('forgot-error');
            const btn     = document.getElementById('forgot-btn');
            errBox.classList.add('hidden');

            if (!email) { errBox.textContent = 'Please enter your email address.'; errBox.classList.remove('hidden'); return; }

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">autorenew</span> Sending…';

            try {
                let sent = false;

                // 1. Call Backend API (sends branded email via stemforgetechnical@gmail.com)
                try {
                    const res = await fetch(`${CONFIG.API_URL}/api/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    if (res.ok) sent = true;
                } catch (apiErr) {
                    console.warn('Backend API reset call:', apiErr);
                }

                // 2. Also trigger Firebase client SDK reset as fallback
                try {
                    await window.firebaseAuth.sendPasswordResetEmail(email);
                    sent = true;
                } catch (fbErr) {
                    console.warn('Firebase client SDK reset:', fbErr);
                }

                // Show success state
                document.getElementById('form-state').classList.add('hidden');
                document.getElementById('success-state').style.display = 'block';
                document.getElementById('sent-email').textContent = email;
            } catch (err) {
                errBox.textContent = '⚠️ Failed to send reset link. Please try again.';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-xl">send</span> Send Reset Link';
            }
        });

        document.getElementById('resend-btn').addEventListener('click', () => {
            document.getElementById('success-state').style.display = 'none';
            document.getElementById('form-state').classList.remove('hidden');
            const btn = document.getElementById('forgot-btn');
            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-outlined text-xl">send</span> Send Reset Link';
        });
    </script>
</body>
</html>
