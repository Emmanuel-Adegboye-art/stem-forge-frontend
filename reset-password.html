<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | STEM Forge</title>
    <meta name="description" content="Set a new password for your STEM Forge account.">

    <script>
        (function() {
            const saved = localStorage.getItem('stemforge-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'forge-orange': '#F59E0B', 'deep-navy': '#0F172A',
                        'secondary': '#565e74', 'surface-gray': '#F8FAFC',
                        'border-subtle': '#e5e7eb', 'action-blue': '#2563EB'
                    },
                    fontFamily: { sans: ['Hanken Grotesk', 'sans-serif'] }
                }
            }
        };
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="js/core/firebase-init.js"></script>

    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .input-wrap { position: relative; }
        .input-field {
            width: 100%; padding: 12px 44px; border: 1.5px solid #e5e7eb;
            border-radius: 10px; font-size: 15px; background: #F8FAFC;
            transition: border-color .2s, box-shadow .2s; outline: none;
        }
        .input-field:focus { border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245,158,11,.12); }
        .input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #565e74; font-size: 20px; }
        .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #565e74; }
        .btn-primary {
            width: 100%; background: #F59E0B; color: #fff; font-weight: 700;
            padding: 14px; border-radius: 10px; border: none; cursor: pointer;
            font-size: 15px; font-family: 'Hanken Grotesk', sans-serif;
            transition: opacity .2s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover:not(:disabled) { opacity: .92; }
        .btn-primary:active:not(:disabled) { transform: scale(.98); }
        .btn-primary:disabled { opacity: .65; cursor: not-allowed; }

        /* Password strength bar */
        .strength-bar { height: 4px; border-radius: 2px; transition: width .3s, background .3s; }

        #success-state { display: none; }
    </style>
</head>
<body class="bg-surface-gray min-h-screen flex items-center justify-center p-6 font-sans">

    <main class="w-full max-w-md">
        <div class="bg-white rounded-2xl border border-border-subtle shadow-sm overflow-hidden">

            <!-- Top bar -->
            <div class="bg-deep-navy px-8 py-6">
                <h1 class="text-white text-2xl font-bold">🔑 Set new password</h1>
                <p class="text-white/70 text-sm mt-1">Choose a strong password for your account.</p>
            </div>

            <div class="px-8 py-8">

                <!-- Invalid token notice (shown if no token in URL) -->
                <div id="invalid-token" class="hidden p-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm mb-4">
                    ⚠️ This reset link is invalid or has expired.
                    <a href="forgot-password.html" class="font-semibold underline ml-1">Request a new one →</a>
                </div>

                <!-- FORM STATE -->
                <div id="form-state">
                    <form id="reset-form" class="space-y-5" novalidate>

                        <!-- New password -->
                        <div>
                            <label for="new-password" class="block text-sm font-semibold text-deep-navy mb-1.5">New password</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">lock</span>
                                <input type="password" id="new-password" required minlength="6"
                                       placeholder="At least 8 characters"
                                       class="input-field" autocomplete="new-password">
                                <button type="button" class="toggle-pw" id="toggle-new" aria-label="Toggle password">
                                    <span class="material-symbols-outlined" id="icon-new">visibility</span>
                                </button>
                            </div>
                            <!-- Strength indicator -->
                            <div class="mt-2 flex gap-1">
                                <div class="flex-1 bg-gray-100 rounded-full overflow-hidden h-1">
                                    <div id="strength-bar" class="strength-bar w-0 bg-red-400"></div>
                                </div>
                            </div>
                            <p id="strength-label" class="text-xs text-secondary mt-1"></p>
                        </div>

                        <!-- Confirm password -->
                        <div>
                            <label for="confirm-password" class="block text-sm font-semibold text-deep-navy mb-1.5">Confirm password</label>
                            <div class="input-wrap">
                                <span class="material-symbols-outlined input-icon">lock_reset</span>
                                <input type="password" id="confirm-password" required minlength="6"
                                       placeholder="Repeat your password"
                                       class="input-field" autocomplete="new-password">
                                <button type="button" class="toggle-pw" id="toggle-confirm" aria-label="Toggle confirm password">
                                    <span class="material-symbols-outlined" id="icon-confirm">visibility</span>
                                </button>
                            </div>
                            <p id="match-label" class="text-xs mt-1"></p>
                        </div>

                        <div id="reset-error" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm"></div>

                        <button type="submit" id="reset-btn" class="btn-primary">
                            <span class="material-symbols-outlined text-xl">lock_reset</span>
                            Update Password
                        </button>
                    </form>
                </div>

                <!-- SUCCESS STATE -->
                <div id="success-state" class="text-center py-4">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-symbols-outlined text-green-600 text-3xl">check_circle</span>
                    </div>
                    <h2 class="text-xl font-bold text-deep-navy mb-2">Password updated!</h2>
                    <p class="text-secondary text-sm mb-5">You can now sign in with your new password.</p>
                    <a href="login.html" class="btn-primary" style="text-decoration:none;display:inline-flex">
                        <span class="material-symbols-outlined text-xl">login</span>
                        Go to Sign In
                    </a>
                </div>

            </div>
        </div>
    </main>

    <script type="module">
        // ── Check oobCode from Firebase email link ─────────────────
        const params  = new URLSearchParams(window.location.search);
        const oobCode = params.get('oobCode'); // Firebase uses oobCode

        if (!oobCode) {
            document.getElementById('invalid-token').classList.remove('hidden');
            document.getElementById('form-state').style.display = 'none';
        }

        // ── Password strength ──────────────────────────────────────
        function checkStrength(pw) {
            if (!pw) return { score: 0, label: '', color: '' };
            let score = 0;
            if (pw.length >= 8) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;
            const map = [
                { label: '',          color: '',           w: '0%'   },
                { label: 'Too short', color: '#ef4444',    w: '25%'  },
                { label: 'Weak',      color: '#f97316',    w: '50%'  },
                { label: 'Good',      color: '#eab308',    w: '75%'  },
                { label: 'Strong',    color: '#22c55e',    w: '100%' }
            ];
            return map[score] || map[0];
        }

        const pwInput = document.getElementById('new-password');
        const cfInput = document.getElementById('confirm-password');

        pwInput.addEventListener('input', () => {
            const s = checkStrength(pwInput.value);
            const bar = document.getElementById('strength-bar');
            bar.style.width = s.w; bar.style.background = s.color;
            document.getElementById('strength-label').textContent = s.label;
            document.getElementById('strength-label').style.color = s.color;
        });

        cfInput.addEventListener('input', () => {
            const ml = document.getElementById('match-label');
            if (!cfInput.value) { ml.textContent = ''; return; }
            if (cfInput.value === pwInput.value) {
                ml.textContent = '✓ Passwords match'; ml.className = 'text-xs mt-1 text-green-600';
            } else {
                ml.textContent = '✗ Passwords do not match'; ml.className = 'text-xs mt-1 text-red-500';
            }
        });

        // ── Toggle visibility ──────────────────────────────────────
        function makeToggle(btnId, inputId, iconId) {
            document.getElementById(btnId).addEventListener('click', () => {
                const inp = document.getElementById(inputId);
                const ico = document.getElementById(iconId);
                inp.type = inp.type === 'password' ? 'text' : 'password';
                ico.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
        makeToggle('toggle-new', 'new-password', 'icon-new');
        makeToggle('toggle-confirm', 'confirm-password', 'icon-confirm');

        // ── Submit ─────────────────────────────────────────────────
        document.getElementById('reset-form').addEventListener('submit', async e => {
            e.preventDefault();
            const newPw  = pwInput.value;
            const confirm = cfInput.value;
            const errBox  = document.getElementById('reset-error');
            const btn     = document.getElementById('reset-btn');
            errBox.classList.add('hidden');

            if (newPw.length < 6) {
                errBox.textContent = '⚠️ Password must be at least 6 characters.';
                errBox.classList.remove('hidden'); return;
            }
            if (newPw !== confirm) {
                errBox.textContent = '⚠️ Passwords do not match.';
                errBox.classList.remove('hidden'); return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">autorenew</span> Updating…';

            try {
                // Firebase confirms the oobCode and sets the new password
                await window.firebaseAuth.confirmPasswordReset(oobCode, newPw);
                document.getElementById('form-state').style.display = 'none';
                document.getElementById('success-state').style.display = 'block';
            } catch (err) {
                const msg = err.code === 'auth/expired-action-code'
                    ? 'This reset link has expired. Please request a new one.'
                    : err.code === 'auth/invalid-action-code'
                    ? 'This reset link is invalid or has already been used.'
                    : err.code === 'auth/weak-password'
                    ? 'Password is too weak. Please choose a stronger password.'
                    : 'Failed to update password. Please try again.';
                errBox.textContent = '⚠️ ' + msg;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-xl">lock_reset</span> Update Password';
            }
        });
    </script>
</body>
</html>
